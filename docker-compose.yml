version: "3.8"
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: web_ai_os_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:ro
      - ./ai_os:/app/ai_os:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: web_ai_os_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

# Optional: network config can be customized
networks:
  default:
    driver: bridge
