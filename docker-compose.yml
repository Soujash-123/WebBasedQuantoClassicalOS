version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aios-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - ./ai_os:/app/ai_os
      - ./data:/app/data
      - ./vfs_storage:/app/vfs_storage
      - ./virtual_storage:/app/virtual_storage
    restart: unless-stopped
    networks:
      - aios-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aios-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aios-network

networks:
  aios-network:
    driver: bridge
